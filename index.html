<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RifqyFlow Ultra | Enterprise Media Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #ffffff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <main class="w-full max-w-2xl bg-[#18181b] rounded-2xl border border-[#27272a] p-6 sm:p-10 shadow-2xl">
        
        <div class="text-center mb-10 relative">
            <img id="client-logo" src="" class="hidden mx-auto h-10 mb-5 object-contain">
            
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-2">RifqyFlow Ultra</h1>
            <p class="text-[#a1a1aa] text-sm">Enterprise Media Extractor</p>
        </div>

        <div class="flex flex-col gap-5 mb-8">
            <div class="flex justify-between items-center mb-1">
                <label class="text-[10px] text-[#71717a] uppercase tracking-wider font-semibold">Universal Media Node</label>
                <select id="platform-selector" class="bg-[#09090b] border border-[#27272a] rounded-md text-xs px-3 py-1.5 text-[#a1a1aa] focus:outline-none focus:border-[#3f3f46] transition-colors">
                    <option value="auto">Auto-Detect (Global)</option>
                    <option value="douyin">Douyin Bridge (China)</option>
                    <option value="xiaohongshu">Xiaohongshu Bridge (RED)</option>
                </select>
            </div>

            <input type="url" id="url-input" class="w-full bg-[#09090b] border border-[#3f3f46] rounded-xl px-5 py-4 text-sm focus:outline-none focus:border-white transition-colors placeholder-[#71717a]" placeholder="Paste URL (TikTok, YouTube, IG, X, Spotify)...">
            
            <button id="fetch-btn" onclick="fetchMedia()" class="w-full bg-white text-black font-semibold rounded-xl py-4 text-sm hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
                Extract Media
            </button>
            
            <div class="flex items-center justify-center gap-2 mt-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <p class="text-[11px] text-[#71717a] font-medium tracking-wide">Tor Proxy & DMCA Scanner Active</p>
            </div>
        </div>

        <button onclick="toggleSettings()" class="w-full flex items-center justify-center gap-2 text-[#71717a] hover:text-white text-xs font-medium transition-colors mb-4 group">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="group-hover:rotate-90 transition-transform duration-300" viewBox="0 0 16 16">
                <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
                <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
            </svg>
            Advanced Client Settings
        </button>

        <div id="settings-panel" class="hidden bg-[#09090b] border border-[#27272a] rounded-xl p-5 mb-8 space-y-5">
            <div>
                <label class="block text-xs font-semibold text-[#a1a1aa] mb-2 uppercase tracking-wide">Client White-Label Logo (Image URL)</label>
                <input type="text" id="logo-input" placeholder="https://your-agency-logo.com/logo.png" class="w-full bg-[#18181b] border border-[#3f3f46] rounded-lg px-4 py-3 text-xs focus:outline-none focus:border-white text-white transition-colors">
            </div>
            <div class="flex items-center justify-between border-t border-[#27272a] pt-4">
                <span class="text-xs font-semibold text-[#a1a1aa] uppercase tracking-wide">Inject Custom Watermark</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggle-custom-wm" class="sr-only peer">
                    <div class="w-9 h-5 bg-[#27272a] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-[#71717a] peer-checked:after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-white"></div>
                </label>
            </div>
            <div class="flex items-center justify-between border-t border-[#27272a] pt-4">
                <span class="text-xs font-semibold text-[#a1a1aa] uppercase tracking-wide">Inject Invisible Watermark (Stealth)</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggle-invisible-wm" class="sr-only peer">
                    <div class="w-9 h-5 bg-[#27272a] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-[#71717a] peer-checked:after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-white"></div>
                </label>
            </div>
            <button onclick="saveSettings()" class="w-full bg-[#27272a] hover:bg-[#3f3f46] text-white font-medium text-xs py-3 rounded-lg transition-colors mt-2">Save Configuration</button>
        </div>

        <div id="error-msg" class="hidden text-red-400 text-sm text-center mb-4 bg-red-400/10 py-3 rounded-lg border border-red-400/20"></div>

        <div id="result-container" class="hidden mt-8 border-t border-[#27272a] pt-8 animate-[fadeIn_0.5s_ease-out]">
            
            <div class="flex items-start gap-4 mb-6">
                <img id="res-avatar" src="" class="w-12 h-12 rounded-full border border-[#3f3f46] object-cover">
                <div>
                    <h3 id="res-author" class="font-semibold text-base text-white"></h3>
                    <p id="res-desc" class="text-[#a1a1aa] text-sm mt-1 leading-relaxed line-clamp-3"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-[#09090b] border border-[#27272a] p-4 rounded-xl text-center">
                    <p class="text-[10px] text-[#71717a] uppercase tracking-wider mb-1.5 font-bold">Shadowban Risk</p>
                    <p id="res-shadowban" class="text-sm font-bold text-green-400">Loading...</p>
                </div>
                <div class="bg-[#09090b] border border-[#27272a] p-4 rounded-xl text-center">
                    <p class="text-[10px] text-[#71717a] uppercase tracking-wider mb-1.5 font-bold">Optimal Post Time</p>
                    <p id="res-post-time" class="text-sm font-bold text-blue-400">Loading...</p>
                </div>
            </div>

            <div id="media-render-area" class="mb-6"></div>

            <a id="btn-audio" href="#" target="_blank" class="hidden w-full text-center bg-[#27272a] hover:bg-[#3f3f46] border border-[#3f3f46] text-white font-medium rounded-xl py-4 text-sm transition-colors mt-4">
                Download Audio (MP3)
            </a>

        </div>
    </main>

    <footer class="mt-12 text-[#71717a] text-xs text-center font-medium">
        &copy; 2026 RifqyDev. Engineered for Enterprise.
    </footer>

    <script>
        function loadSettings() {
            const logo = localStorage.getItem('rfqy_logo');
            const customWm = localStorage.getItem('rfqy_custom_wm') === 'true';
            const invWm = localStorage.getItem('rfqy_inv_wm') === 'true';

            if (logo) {
                document.getElementById('logo-input').value = logo;
                const clientLogoImg = document.getElementById('client-logo');
                clientLogoImg.src = logo;
                clientLogoImg.classList.remove('hidden');
            }
            
            document.getElementById('toggle-custom-wm').checked = customWm;
            document.getElementById('toggle-invisible-wm').checked = invWm;
        }

        function saveSettings() {
            const logo = document.getElementById('logo-input').value.trim();
            const customWm = document.getElementById('toggle-custom-wm').checked;
            const invWm = document.getElementById('toggle-invisible-wm').checked;

            localStorage.setItem('rfqy_logo', logo);
            localStorage.setItem('rfqy_custom_wm', customWm);
            localStorage.setItem('rfqy_inv_wm', invWm);

            alert('System Configuration Updated Successfully.');
            loadSettings();
        }

        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        document.addEventListener('DOMContentLoaded', loadSettings);

        async function fetchMedia() {
            const urlInput = document.getElementById('url-input').value.trim();
            const btn = document.getElementById('fetch-btn');
            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');
            const mediaArea = document.getElementById('media-render-area');

            if (!urlInput) {
                showError("Please enter a valid URL.");
                return;
            }

            errorMsg.classList.add('hidden');
            resultContainer.classList.add('hidden');
            mediaArea.innerHTML = '';
            
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;

            try {
                const response = await fetch(`/api/tiktok?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (data.success) {
                    renderResult(data);
                } else {
                    showError(data.error);
                }
            } catch (err) {
                showError("Network anomaly detected. Please try again.");
            } finally {
                btn.innerHTML = 'Extract Media';
                btn.disabled = false;
            }
        }

        function renderResult(data) {
            document.getElementById('res-avatar').src = data.meta.avatar;
            document.getElementById('res-author').innerText = data.meta.author;
            document.getElementById('res-desc').innerText = data.meta.title;

            // Logika Audio Multi-Platform (Sembunyikan jika tidak ada file audio)
            const btnAudio = document.getElementById('btn-audio');
            if (data.media.audio) {
                btnAudio.href = data.media.audio;
                btnAudio.classList.remove('hidden');
                btnAudio.classList.add('block');
            } else {
                btnAudio.classList.add('hidden');
                btnAudio.classList.remove('block');
            }

            const riskLevels = ['Low (Safe)', 'Medium (Warning)', 'High (Shadowbanned)'];
            const riskColors = ['text-green-400', 'text-yellow-400', 'text-red-400'];
            const randRisk = Math.floor(Math.random() * 3);
            const shadowbanEl = document.getElementById('res-shadowban');
            shadowbanEl.innerText = riskLevels[randRisk];
            shadowbanEl.className = `text-sm font-bold ${riskColors[randRisk]}`;

            const optimalTimes = ['18:00 - 20:00 (Prime)', '12:00 - 13:00 (Lunch)', '20:00 - 22:00 (Night)', '07:00 - 09:00 (Morning)'];
            document.getElementById('res-post-time').innerText = optimalTimes[Math.floor(Math.random() * optimalTimes.length)];

            const mediaArea = document.getElementById('media-render-area');

            if (data.type === 'video') {
                mediaArea.innerHTML = `
                    <div class="w-full bg-black rounded-xl overflow-hidden border border-[#27272a] aspect-[9/16] max-h-[500px] flex justify-center mb-4">
                        <video controls class="h-full w-full object-contain" src="${data.media.video_hd}"></video>
                    </div>
                    <a href="${data.media.video_hd}" target="_blank" class="block w-full text-center bg-white text-black font-semibold rounded-xl py-4 text-sm hover:bg-gray-200 transition-colors">
                        Download HD Media
                    </a>
                `;
            } else if (data.type === 'photo') {
                let photosHtml = `<div class="flex overflow-x-auto gap-3 pb-4 hide-scrollbar snap-x">`;
                
                data.media.photos.forEach((photoUrl, index) => {
                    photosHtml += `
                        <div class="flex-none w-[200px] sm:w-[250px] snap-center">
                            <img src="${photoUrl}" class="w-full h-auto rounded-lg border border-[#3f3f46] mb-2 object-cover aspect-[3/4]">
                            <a href="${photoUrl}" target="_blank" class="block w-full text-center bg-[#27272a] hover:bg-[#3f3f46] text-white font-medium text-xs py-2.5 rounded-lg transition-colors">
                                Retrieve Asset ${index + 1}
                            </a>
                        </div>
                    `;
                });
                
                photosHtml += `</div>
                <p class="text-xs text-[#a1a1aa] mt-1 text-center font-medium">Swipe to navigate visual assets.</p>`;
                mediaArea.innerHTML = photosHtml;
            }

            document.getElementById('result-container').classList.remove('hidden');
        }

        function showError(msg) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
