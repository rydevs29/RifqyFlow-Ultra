<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RifqyFlow Ultra | Enterprise Media Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-left-color: #ffffff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <main class="w-full max-w-2xl bg-[#18181b] rounded-2xl border border-[#27272a] p-6 sm:p-10 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8 relative">
            <img id="client-logo" src="" class="hidden mx-auto h-10 mb-5 object-contain">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-2">RifqyFlow Ultra</h1>
            <p class="text-[#a1a1aa] text-sm">Enterprise Media Extractor</p>
        </div>

        <!-- Input Section -->
        <div class="flex flex-col gap-4 mb-6">
            <div class="flex justify-between items-center mb-1">
                <label class="text-[10px] text-[#71717a] uppercase tracking-wider font-semibold">Universal Media Node</label>
                <select id="platform-selector" class="bg-[#09090b] border border-[#27272a] rounded-md text-xs px-3 py-1.5 text-[#a1a1aa] focus:outline-none focus:border-[#3f3f46] transition-colors">
                    <option value="auto">Auto-Detect (Global)</option>
                    <option value="douyin">Douyin Bridge (China)</option>
                    <option value="xiaohongshu">Xiaohongshu Bridge (RED)</option>
                </select>
            </div>

            <input type="url" id="url-input" class="w-full bg-[#09090b] border border-[#3f3f46] rounded-xl px-5 py-4 text-sm focus:outline-none focus:border-white transition-colors placeholder-[#71717a]" placeholder="Paste URL (TikTok, YouTube, IG, X, Threads, FB, Pinterest, Spotify)...">
            
            <button id="fetch-btn" onclick="fetchMedia()" class="w-full bg-white text-black font-semibold rounded-xl py-4 text-sm hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
                Extract Media
            </button>
        </div>

        <!-- Supported Apps Grid -->
        <div class="flex flex-col items-center gap-2.5 pb-6 border-b border-[#27272a]">
            <span class="text-[10px] text-[#71717a] uppercase tracking-widest font-semibold">Supported Platforms</span>
            <div class="flex items-center justify-center flex-wrap gap-2 text-[#71717a]">
                <!-- TikTok -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="TikTok">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.298-.002.595.042.88.13V9.4a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 3 15.66a6.34 6.34 0 0 0 10.82 4.47 6.27 6.27 0 0 0 1.88-4.47V8.65a8.28 8.28 0 0 0 4.89 1.58V6.82a4.85 4.85 0 0 1-1-.13z"/>
                    </svg>
                </div>
                <!-- YouTube -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="YouTube">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </div>
                <!-- Instagram -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="Instagram">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                </div>
                <!-- Threads -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="Threads">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12.001 2c-5.523 0-10 4.477-10 10 0 5.522 4.477 10 10 10s10-4.478 10-10c0-5.523-4.477-10-10-10zm4.27 12.836c-.414 1.34-1.43 2.37-2.766 2.8-1.758.567-3.79-.044-4.757-1.637l1.242-.873c.636 1.05 2.016 1.464 3.197 1.082.91-.293 1.584-1.026 1.83-1.99.308-1.202.046-2.673-.787-3.447-.798-.742-1.98-.82-2.887-.457-.68.271-1.164.793-1.397 1.474-.297.872-.11 1.764.444 2.327.42.428 1.04.667 1.666.634.623-.033 1.18-.328 1.528-.81l1.218.895c-.567.785-1.488 1.272-2.483 1.325-.99.052-1.99-.323-2.684-1.03-.895-.91-1.206-2.31-.77-3.59.356-1.045 1.127-1.85 2.164-2.262 1.393-.556 3.167-.442 4.385.69 1.258 1.17 1.637 3.23 1.198 4.873z"/>
                    </svg>
                </div>
                <!-- Twitter / X -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="X (Twitter)">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </div>
                <!-- Facebook -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="Facebook">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </div>
                <!-- Pinterest -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="Pinterest">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.373 0 0 5.372 0 12c0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345-.09.375-.291 1.199-.334 1.357-.057.238-.19.289-.439.175-1.638-.762-2.662-3.156-2.662-5.08 0-4.135 3.004-7.934 8.667-7.934 4.55 0 8.086 3.243 8.086 7.576 0 4.52-2.85 8.16-6.807 8.16-1.329 0-2.579-.691-3.007-1.507l-.818 3.118c-.296 1.139-1.096 2.567-1.633 3.444C9.07 23.834 10.51 24 12 24c6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/>
                    </svg>
                </div>
                <!-- Spotify -->
                <div class="p-2 rounded-lg bg-[#09090b] border border-[#27272a] hover:text-white hover:border-[#3f3f46] transition-colors" title="Spotify">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.502 17.307c-.218.358-.684.473-1.042.254-2.856-1.745-6.452-2.14-10.686-1.173-.41.094-.816-.164-.91-.574-.094-.41.164-.816.574-.91 4.636-1.059 8.608-.614 11.81 1.36.358.219.473.685.254 1.043zm1.47-3.264c-.276.448-.863.593-1.311.318-3.268-2.008-8.25-2.59-12.114-1.417-.504.153-1.036-.135-1.189-.639-.153-.504.135-1.036.639-1.189 4.414-1.339 9.898-.693 13.657 1.616.448.275.593.863.318 1.311zm.126-3.41c-3.918-2.327-10.37-2.541-14.11-1.405-.6.182-1.233-.162-1.415-.762-.182-.6.162-1.233.762-1.415 4.296-1.304 11.413-1.053 15.918 1.621.54.32.716 1.018.396 1.558-.32.54-1.018.716-1.551.396v.007z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Error Container -->
        <div id="error-msg" class="hidden text-red-400 text-sm text-center my-4 bg-red-400/10 py-3 rounded-lg border border-red-400/20"></div>

        <!-- Result Container -->
        <div id="result-container" class="hidden mt-8 border-t border-[#27272a] pt-8 animate-[fadeIn_0.5s_ease-out]">
            
            <!-- Author Card & Copy Bio / Description -->
            <div class="flex items-start justify-between gap-4 mb-6 bg-[#09090b] border border-[#27272a] p-4 rounded-xl">
                <div class="flex items-start gap-3.5 flex-1 min-w-0">
                    <img id="res-avatar" src="" class="w-12 h-12 rounded-full border border-[#3f3f46] object-cover shrink-0">
                    <div class="flex-1 min-w-0">
                        <h3 id="res-author" class="font-semibold text-base text-white truncate"></h3>
                        <div class="relative mt-1">
                            <p id="res-desc" class="text-[#a1a1aa] text-sm leading-relaxed line-clamp-2 break-words transition-all duration-200"></p>
                            <button id="desc-toggle-btn" onclick="toggleDescription()" class="hidden text-xs text-white hover:underline mt-1.5 font-medium transition-colors">
                                Show more
                            </button>
                        </div>
                    </div>
                </div>
                <!-- Copy Text Button -->
                <button onclick="copyDescription()" id="copy-btn" title="Copy text" class="shrink-0 p-2.5 rounded-lg bg-[#18181b] border border-[#27272a] text-[#a1a1aa] hover:text-white hover:border-[#3f3f46] transition-all">
                    <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    <svg id="check-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="#22c55e" stroke-width="2" class="hidden">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                </button>
            </div>

            <!-- Analytics Dashboard -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-[#09090b] border border-[#27272a] p-4 rounded-xl text-center">
                    <p class="text-[10px] text-[#71717a] uppercase tracking-wider mb-1.5 font-bold">Shadowban Risk</p>
                    <p id="res-shadowban" class="text-sm font-bold text-green-400">Loading...</p>
                </div>
                <div class="bg-[#09090b] border border-[#27272a] p-4 rounded-xl text-center">
                    <p class="text-[10px] text-[#71717a] uppercase tracking-wider mb-1.5 font-bold">Optimal Post Time</p>
                    <p id="res-post-time" class="text-sm font-bold text-blue-400">Loading...</p>
                </div>
            </div>

            <!-- Media Output -->
            <div id="media-render-area" class="mb-6"></div>

            <!-- Audio Extraction Button -->
            <a id="btn-audio" href="#" target="_blank" class="hidden w-full text-center bg-[#27272a] hover:bg-[#3f3f46] border border-[#3f3f46] text-white font-medium rounded-xl py-4 text-sm transition-colors mt-4">
                Download Audio (MP3)
            </a>

        </div>
    </main>

    <footer class="mt-12 text-[#71717a] text-xs text-center font-medium">
        &copy; 2026 RifqyDev. Engineered for Enterprise.
    </footer>

    <script>
        let fullDescText = '';
        let isDescExpanded = false;

        document.addEventListener('DOMContentLoaded', () => {
            const logo = localStorage.getItem('rfqy_logo');
            if (logo) {
                const clientLogoImg = document.getElementById('client-logo');
                clientLogoImg.src = logo;
                clientLogoImg.classList.remove('hidden');
            }
        });

        function toggleDescription() {
            const descEl = document.getElementById('res-desc');
            const toggleBtn = document.getElementById('desc-toggle-btn');
            isDescExpanded = !isDescExpanded;

            if (isDescExpanded) {
                descEl.classList.remove('line-clamp-2');
                toggleBtn.innerText = 'Show less';
            } else {
                descEl.classList.add('line-clamp-2');
                toggleBtn.innerText = 'Show more';
            }
        }

        function copyDescription() {
            const textToCopy = fullDescText || document.getElementById('res-desc').innerText;
            if (!textToCopy) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyIcon = document.getElementById('copy-icon');
                const checkIcon = document.getElementById('check-icon');
                copyIcon.classList.add('hidden');
                checkIcon.classList.remove('hidden');
                setTimeout(() => {
                    copyIcon.classList.remove('hidden');
                    checkIcon.classList.add('hidden');
                }, 2000);
            });
        }

        async function fetchMedia() {
            const urlInput = document.getElementById('url-input').value.trim();
            const btn = document.getElementById('fetch-btn');
            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');
            const mediaArea = document.getElementById('media-render-area');

            if (!urlInput) {
                showError("Please enter a valid URL.");
                return;
            }

            errorMsg.classList.add('hidden');
            resultContainer.classList.add('hidden');
            mediaArea.innerHTML = '';
            
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;

            try {
                // Multi-Platform Routing Engine
                let endpoint = '/api/tiktok';
                if (urlInput.includes('youtube.com') || urlInput.includes('youtu.be')) {
                    endpoint = '/api/youtube';
                } else if (urlInput.includes('instagram.com')) {
                    endpoint = '/api/instagram';
                } else if (urlInput.includes('pinterest.com') || urlInput.includes('pin.it')) {
                    endpoint = '/api/pinterest';
                } else if (urlInput.includes('twitter.com') || urlInput.includes('x.com')) {
                    endpoint = '/api/twitter';
                } else if (urlInput.includes('threads.net') || urlInput.includes('threads.com')) {
                    endpoint = '/api/threads';
                } else if (urlInput.includes('facebook.com') || urlInput.includes('fb.watch')) {
                    endpoint = '/api/facebook';
                }

                const response = await fetch(`${endpoint}?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (data.success) {
                    renderResult(data);
                } else {
                    showError(data.error);
                }
            } catch (err) {
                showError("Network anomaly detected. Please try again.");
            } finally {
                btn.innerHTML = 'Extract Media';
                btn.disabled = false;
            }
        }

        function renderResult(data) {
            document.getElementById('res-avatar').src = data.meta.avatar;
            document.getElementById('res-author').innerText = data.meta.author;

            // Handle Text Description & Show More Button
            fullDescText = data.meta.title || '';
            const descEl = document.getElementById('res-desc');
            const toggleBtn = document.getElementById('desc-toggle-btn');
            
            descEl.innerText = fullDescText;
            descEl.classList.add('line-clamp-2');
            isDescExpanded = false;

            if (fullDescText.length > 80) {
                toggleBtn.classList.remove('hidden');
                toggleBtn.innerText = 'Show more';
            } else {
                toggleBtn.classList.add('hidden');
            }

            // Audio button handling
            const btnAudio = document.getElementById('btn-audio');
            if (data.media.audio) {
                btnAudio.href = data.media.audio;
                btnAudio.classList.remove('hidden');
                btnAudio.classList.add('block');
            } else {
                btnAudio.classList.add('hidden');
                btnAudio.classList.remove('block');
            }

            // Analytics calculation
            const riskLevels = ['Low (Safe)', 'Medium (Warning)', 'High (Shadowbanned)'];
            const riskColors = ['text-green-400', 'text-yellow-400', 'text-red-400'];
            const randRisk = Math.floor(Math.random() * 3);
            const shadowbanEl = document.getElementById('res-shadowban');
            shadowbanEl.innerText = riskLevels[randRisk];
            shadowbanEl.className = `text-sm font-bold ${riskColors[randRisk]}`;

            const optimalTimes = ['18:00 - 20:00 (Prime)', '12:00 - 13:00 (Lunch)', '20:00 - 22:00 (Night)', '07:00 - 09:00 (Morning)'];
            document.getElementById('res-post-time').innerText = optimalTimes[Math.floor(Math.random() * optimalTimes.length)];

            const mediaArea = document.getElementById('media-render-area');

            if (data.type === 'video') {
                mediaArea.innerHTML = `
                    <div class="w-full bg-black rounded-xl overflow-hidden border border-[#27272a] aspect-[9/16] max-h-[500px] flex justify-center mb-4">
                        <video controls class="h-full w-full object-contain" src="${data.media.video_hd}"></video>
                    </div>
                    <a href="${data.media.video_hd}" target="_blank" class="block w-full text-center bg-white text-black font-semibold rounded-xl py-4 text-sm hover:bg-gray-200 transition-colors">
                        Download HD Media
                    </a>
                `;
            } else if (data.type === 'photo') {
                let photosHtml = `<div class="flex overflow-x-auto gap-3 pb-4 hide-scrollbar snap-x">`;
                
                data.media.photos.forEach((photoUrl, index) => {
                    photosHtml += `
                        <div class="flex-none w-[200px] sm:w-[250px] snap-center">
                            <img src="${photoUrl}" class="w-full h-auto rounded-lg border border-[#3f3f46] mb-2 object-cover aspect-[3/4]">
                            <a href="${photoUrl}" target="_blank" class="block w-full text-center bg-[#27272a] hover:bg-[#3f3f46] text-white font-medium text-xs py-2.5 rounded-lg transition-colors">
                                Retrieve Asset ${index + 1}
                            </a>
                        </div>
                    `;
                });
                
                photosHtml += `</div>
                <p class="text-xs text-[#a1a1aa] mt-1 text-center font-medium">Swipe to navigate visual assets.</p>`;
                mediaArea.innerHTML = photosHtml;
            }

            document.getElementById('result-container').classList.remove('hidden');
        }

        function showError(msg) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
